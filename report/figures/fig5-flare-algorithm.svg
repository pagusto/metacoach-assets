<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="100%" role="img" aria-labelledby="t d"><title id="t">Decision algorithm distinguishing a Crohn's flare from a drug adverse effect</title><desc id="d">Flow chart: symptoms persisting beyond seven days trigger faecal calprotectin and CRP; rising markers are treated as active disease, quiet markers as a drug effect.</desc><rect width="700" height="430" fill="#ffffff"/><text x="14.0" y="22.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Is this the disease or is this the drug?</text><text x="14.0" y="37.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">The decision this protocol exists to make. Symptom character cannot separate the two — only objective markers can.</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5d6f79"/></marker></defs><rect x="200.0" y="56" width="300" height="46" rx="4" fill="#f5f8f9" stroke="#c9d3d8" stroke-width="1.1"/><text x="350.0" y="73.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.2" fill="#17262e" text-anchor="middle" font-weight="700" font-style="normal">New or worsening GI symptom</text><text x="350.0" y="87.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">loose stools · cramping · nausea · bloating</text><path d="M350.0,102 L350.0,124" stroke="#5d6f79" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><rect x="200.0" y="124" width="300" height="44" rx="4" fill="#f1e0d3" stroke="#bf5a1c" stroke-width="1.1"/><text x="350.0" y="141.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.2" fill="#8a3f12" text-anchor="middle" font-weight="700" font-style="normal">Persists beyond 7 days?</text><path d="M200.0,146 L120,146" stroke="#5d6f79" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><text x="160.0" y="139.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" fill="#5d6f79" text-anchor="middle" font-weight="700" font-style="normal">no</text><rect x="14" y="178" width="212" height="62" rx="4" fill="#fbfcfc" stroke="#c9d3d8" stroke-width="1.1"/><text x="120.0" y="195.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.2" fill="#17262e" text-anchor="middle" font-weight="700" font-style="normal">Symptomatic management</text><text x="120.0" y="209.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">dose timing, low-fat meals, hydration,</text><text x="120.0" y="221.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">magnesium; log it and keep the</text><text x="120.0" y="233.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">8-week marker schedule</text><path d="M350.0,168 L350.0,196" stroke="#5d6f79" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><text x="357.0" y="185.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" fill="#5d6f79" text-anchor="start" font-weight="700" font-style="normal">yes</text><rect x="234.0" y="196" width="232" height="62" rx="4" fill="#eaf1f4" stroke="#1f6f8b" stroke-width="1.1"/><text x="350.0" y="213.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.2" fill="#16506b" text-anchor="middle" font-weight="700" font-style="normal">Measure, do not infer</text><text x="350.0" y="227.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#16506b" text-anchor="middle" font-weight="400" font-style="normal">faecal calprotectin + CRP</text><text x="350.0" y="239.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#16506b" text-anchor="middle" font-weight="400" font-style="normal">(± CBC, ferritin, albumin)</text><path d="M290.0,258 L300,288" stroke="#5d6f79" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><path d="M410.0,258 L470,288" stroke="#5d6f79" stroke-width="1.4" marker-end="url(#ah)" fill="none"/><rect x="196" y="288" width="208" height="74" rx="4" fill="#fdf0ec" stroke="#bf5a1c" stroke-width="1.1"/><text x="300.0" y="305.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.2" fill="#8a3f12" text-anchor="middle" font-weight="700" font-style="normal">Markers rising</text><text x="300.0" y="319.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#8a3f12" text-anchor="middle" font-weight="400" font-style="normal">treat as active disease</text><text x="300.0" y="331.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#8a3f12" text-anchor="middle" font-weight="400" font-style="normal">gastroenterology review now;</text><text x="300.0" y="343.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#8a3f12" text-anchor="middle" font-weight="400" font-style="normal">hold dose escalation and</text><text x="300.0" y="355.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#8a3f12" text-anchor="middle" font-weight="400" font-style="normal">suspend resistance training</text><rect x="420" y="288" width="208" height="74" rx="4" fill="#eef4f0" stroke="#3f7d5c" stroke-width="1.1"/><text x="524.0" y="305.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.2" fill="#2f5f45" text-anchor="middle" font-weight="700" font-style="normal">Markers quiet</text><text x="524.0" y="319.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#2f5f45" text-anchor="middle" font-weight="400" font-style="normal">treat as drug adverse effect</text><text x="524.0" y="331.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#2f5f45" text-anchor="middle" font-weight="400" font-style="normal">hold current dose, manage</text><text x="524.0" y="343.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#2f5f45" text-anchor="middle" font-weight="400" font-style="normal">symptomatically, re-measure</text><text x="524.0" y="355.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.1" fill="#2f5f45" text-anchor="middle" font-weight="400" font-style="normal">at the next 8-week point</text><rect x="14" y="380" width="672" height="38" rx="4" fill="#fbfcfc" stroke="#c9d3d8"/><text x="26.0" y="396.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.4" fill="#bf5a1c" text-anchor="start" font-weight="700" font-style="normal">Override at any point:</text><text x="132.0" y="396.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#17262e" text-anchor="start" font-weight="400" font-style="normal">rectal bleeding · fever · pain &gt; 3/10 · vomiting with distension or absent stool · rapid unintended weight loss</text><text x="26.0" y="410.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">These are not titration problems. They are urgent obstruction, abscess or perforation questions — same-day assessment.</text></svg>
