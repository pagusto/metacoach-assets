<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="100%" role="img" aria-labelledby="t d"><title id="t">Pooled GLP-1 receptor agonist outcomes in inflammatory bowel disease</title><desc id="d">Forest plot of surgery and hospitalisation hazard ratios, and a note that no protective effect on ileus was demonstrated.</desc><rect width="700" height="330" fill="#ffffff"/><text x="14.0" y="30.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">What the IBD evidence actually supports</text><text x="14.0" y="45.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">Pooled estimates from retrospective cohorts of GLP-1 receptor agonist users with IBD. No trial has randomised an IBD population.</text><line x1="281.1" y1="68" x2="281.1" y2="268.0" stroke="#e2e8eb"/><text x="281.1" y="285.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">0.4</text><line x1="319.2" y1="68" x2="319.2" y2="268.0" stroke="#e2e8eb"/><text x="319.2" y="285.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">0.5</text><line x1="376.6" y1="68" x2="376.6" y2="268.0" stroke="#e2e8eb"/><text x="376.6" y="285.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">0.7</text><line x1="437.5" y1="68" x2="437.5" y2="268.0" stroke="#e2e8eb"/><text x="437.5" y="285.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">1.0</text><line x1="506.6" y1="68" x2="506.6" y2="268.0" stroke="#e2e8eb"/><text x="506.6" y="285.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">1.5</text><line x1="555.7" y1="68" x2="555.7" y2="268.0" stroke="#e2e8eb"/><text x="555.7" y="285.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">2.0</text><line x1="437.5" y1="68" x2="437.5" y2="268.0" stroke="#5d6f79" stroke-width="1.3"/><line x1="232" y1="268.0" x2="572" y2="268.0" stroke="#c9d3d8" stroke-width="1.2"/><text x="437.5" y="302.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="middle" font-weight="400" font-style="normal">hazard ratio (log scale)</text><text x="429.5" y="318.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.8" fill="#8fa0a9" text-anchor="end" font-weight="400" font-style="normal">◀ favours GLP-1 RA</text><text x="445.5" y="318.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.8" fill="#8fa0a9" text-anchor="start" font-weight="400" font-style="normal">favours non-use ▶</text><text x="14.0" y="105.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.4" fill="#17262e" text-anchor="start" font-weight="600" font-style="normal">Any IBD-related surgery</text><text x="14.0" y="117.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.8" fill="#8fa0a9" text-anchor="start" font-weight="400" font-style="normal">11 studies · 16,242 pts</text><line x1="297.4" y1="104.1" x2="407.7" y2="104.1" stroke="#1f6f8b" stroke-width="1.6"/><line x1="297.4" y1="99.6" x2="297.4" y2="108.6" stroke="#1f6f8b" stroke-width="1.6"/><line x1="407.7" y1="99.6" x2="407.7" y2="108.6" stroke="#1f6f8b" stroke-width="1.6"/><rect x="348.5" y="99.5" width="9.2" height="9.2" fill="#1f6f8b" transform="rotate(45 353.1 104.1)"/><text x="686.0" y="105.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.4" fill="#1f6f8b" text-anchor="end" font-weight="700" font-style="normal">HR 0.61 (0.44–0.84)</text><text x="686.0" y="117.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#1f6f8b" text-anchor="end" font-weight="400" font-style="normal">significant</text><text x="14.0" y="153.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.4" fill="#17262e" text-anchor="start" font-weight="600" font-style="normal">Hospitalisation, all IBD</text><text x="14.0" y="165.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.8" fill="#8fa0a9" text-anchor="start" font-weight="400" font-style="normal">pooled cohorts</text><line x1="379.0" y1="152.6" x2="464.2" y2="152.6" stroke="#9aa7ae" stroke-width="1.6"/><line x1="379.0" y1="148.1" x2="379.0" y2="157.1" stroke="#9aa7ae" stroke-width="1.6"/><line x1="464.2" y1="148.1" x2="464.2" y2="157.1" stroke="#9aa7ae" stroke-width="1.6"/><rect x="416.8" y="148.0" width="9.2" height="9.2" fill="#9aa7ae" transform="rotate(45 421.4 152.6)"/><text x="686.0" y="153.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.4" fill="#9aa7ae" text-anchor="end" font-weight="400" font-style="normal">HR 0.91 (0.71–1.17)</text><text x="686.0" y="165.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#8fa0a9" text-anchor="end" font-weight="400" font-style="normal">not significant</text><text x="14.0" y="202.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.4" fill="#17262e" text-anchor="start" font-weight="600" font-style="normal">Hospitalisation, Crohn's</text><text x="14.0" y="214.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.8" fill="#8fa0a9" text-anchor="start" font-weight="400" font-style="normal">sensitivity analysis</text><line x1="395.1" y1="201.1" x2="453.7" y2="201.1" stroke="#9aa7ae" stroke-width="1.6"/><line x1="395.1" y1="196.6" x2="395.1" y2="205.6" stroke="#9aa7ae" stroke-width="1.6"/><line x1="453.7" y1="196.6" x2="453.7" y2="205.6" stroke="#9aa7ae" stroke-width="1.6"/><rect x="420.5" y="196.5" width="9.2" height="9.2" fill="#9aa7ae" transform="rotate(45 425.1 201.1)"/><text x="686.0" y="202.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.4" fill="#9aa7ae" text-anchor="end" font-weight="400" font-style="normal">HR 0.93 (0.78–1.10)</text><text x="686.0" y="214.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#8fa0a9" text-anchor="end" font-weight="400" font-style="normal">not significant</text><line x1="14" y1="235.6" x2="686" y2="235.6" stroke="#c9d3d8" stroke-dasharray="3 3"/><text x="14.0" y="251.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.4" fill="#17262e" text-anchor="start" font-weight="600" font-style="normal">Ileus / intestinal obstruction</text><text x="14.0" y="263.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.8" fill="#bf5a1c" text-anchor="start" font-weight="400" font-style="normal">the claim this report withdraws</text><rect x="232" y="240.6" width="340" height="18" rx="3" fill="#f6f7f8"/><text x="402.0" y="253.1" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.4" fill="#5d6f79" text-anchor="middle" font-weight="600" font-style="normal">no significant association in either direction</text><text x="686.0" y="251.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.4" fill="#bf5a1c" text-anchor="end" font-weight="700" font-style="normal">not protective</text><text x="686.0" y="263.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#8fa0a9" text-anchor="end" font-weight="400" font-style="normal">≈1–2% event rate</text></svg>
