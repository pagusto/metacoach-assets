<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="100%" role="img" aria-labelledby="t d"><title id="t">Evidence standing of each compound</title><desc id="d">Five tiers from randomised phase 3 human evidence down to compounds with no human efficacy data.</desc><rect width="700" height="372" fill="#ffffff"/><text x="14.0" y="22.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Evidence standing of every compound in the protocol</text><text x="14.0" y="37.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">Read top to bottom: the further down a compound sits, the more of its rationale is inference rather than measurement.</text><rect x="14" y="54.0" width="672" height="49.4" rx="3" fill="#fbfcfc"/><rect x="14" y="54.0" width="4.5" height="49.4" rx="2" fill="#16506b"/><text x="30.0" y="73.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.6" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Randomised phase 3 evidence in humans</text><text x="30.0" y="88.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">approved for obesity; IBD data are observational only</text><rect x="598.9" y="66.0" width="73.1" height="20" rx="10" fill="#16506b"/><text x="635.5" y="79.8" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">Tirzepatide</text><rect x="517.8" y="66.0" width="73.1" height="20" rx="10" fill="#16506b"/><text x="554.4" y="79.8" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">Semaglutide</text><rect x="14" y="112.4" width="672" height="49.4" rx="3" fill="#f5f8f9"/><rect x="14" y="112.4" width="4.5" height="49.4" rx="2" fill="#1f6f8b"/><text x="30.0" y="131.4" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.6" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Randomised phase 2–3, still investigational</text><text x="30.0" y="146.4" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">no IBD trial; FDA submission signalled for Q1 2027</text><rect x="598.9" y="124.4" width="73.1" height="20" rx="10" fill="#1f6f8b"/><text x="635.5" y="138.2" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">Retatrutide</text><rect x="14" y="170.8" width="672" height="49.4" rx="3" fill="#fbfcfc"/><rect x="14" y="170.8" width="4.5" height="49.4" rx="2" fill="#4c6b7a"/><text x="30.0" y="189.8" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.6" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Retrospective human cohorts only</text><text x="30.0" y="204.8" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">surgery HR 0.61; confounding by indication unresolved</text><rect x="557.6" y="182.8" width="114.4" height="20" rx="10" fill="#4c6b7a"/><text x="614.8" y="196.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">GLP-1 class in IBD</text><rect x="14" y="229.2" width="672" height="49.4" rx="3" fill="#f5f8f9"/><rect x="14" y="229.2" width="4.5" height="49.4" rx="2" fill="#c9a227"/><text x="30.0" y="248.2" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.6" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Animal models only</text><text x="30.0" y="263.2" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">rodent colitis and soft-tissue healing; no published human trial</text><rect x="622.5" y="241.2" width="49.5" height="20" rx="10" fill="#c9a227"/><text x="647.2" y="255.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">BPC-157</text><rect x="588.6" y="241.2" width="25.9" height="20" rx="10" fill="#c9a227"/><text x="601.5" y="255.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">KPV</text><rect x="14" y="287.6" width="672" height="49.4" rx="3" fill="#fbfcfc"/><rect x="14" y="287.6" width="4.5" height="49.4" rx="2" fill="#bf5a1c"/><text x="30.0" y="306.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.6" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">No human efficacy data of any kind</text><text x="30.0" y="321.6" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">extrapolated from thymosin β4 biology</text><rect x="628.4" y="299.6" width="43.6" height="20" rx="10" fill="#bf5a1c"/><text x="650.2" y="313.4" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700" font-style="normal">TB-500</text></svg>
