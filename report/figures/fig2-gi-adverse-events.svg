a1c" rx="1.5"/><text x="587.1" y="249.3" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#bf5a1c" text-anchor="middle" font-weight="700" font-style="normal">10.6</text><rect x="604.6" y="194.7" width="25.7" height="111.3" fill="#4c6b7a" rx="1.5"/><text x="617.4" y="189.7" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#4c6b7a" text-anchor="middle" font-weight="700" font-style="normal">22.8</text><rect x="634.9" y="182.5" width="25.7" height="123.5" fill="#1f6f8b" rx="1.5"/><text x="647.7" y="177.5" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.6" fill="#1f6f8b" text-anchor="middle" font-weight="700" font-style="normal">25.3</text><text x="602.2" y="325.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" fill="#17262e" text-anchor="middle" font-weight="600" font-style="normal">Vomiting</text><line x1="524.5" y1="68" x2="524.5" y2="306.0" stroke="#e2e8eb"/><line x1="58" y1="306.0" x2="680" y2="306.0" stroke="#c9d3d8" stroke-width="1.2"/><path d="M276.1,167.0 L276.1,88.0 L444.0,88.0" fill="none" stroke="#bf5a1c" stroke-width="1.2" stroke-dasharray="3 2.5"/><circle cx="276.1" cy="167.0" r="2.6" fill="#bf5a1c"/><rect x="448.0" y="70" width="232" height="36" rx="3" fill="#f1e0d3" stroke="#bf5a1c" stroke-width="0.8"/><text x="458.0" y="84.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#8a3f12" text-anchor="start" font-weight="700" font-style="normal">1 in 4 on 4 mg reports diarrhoea —</text><text x="458.0" y="97.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.2" fill="#8a3f12" text-anchor="start" font-weight="400" font-style="normal">indistinguishable from a flare on symptoms alone.</text><text x="58.0" y="22.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11.5" fill="#17262e" text-anchor="start" font-weight="700" font-style="normal">Gastrointestinal adverse events are dose-related — but only modestly lower at 4 mg</text><text x="58.0" y="37.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">TRIUMPH-1, n = 2,339, 80 weeks. Events were predominantly mild to moderate.</text><rect x="58" y="344" width="11" height="11" fill="#9aa7ae" rx="1.5"/><text x="74.0" y="353.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">Placebo</text><rect x="132" y="344" width="11" height="11" fill="#bf5a1c" rx="1.5"/><text x="148.0" y="353.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="600" font-style="normal">4 mg</text><rect x="206" y="344" width="11" height="11" fill="#4c6b7a" rx="1.5"/><text x="222.0" y="353.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">9 mg</text><rect x="280" y="344" width="11" height="11" fill="#1f6f8b" rx="1.5"/><text x="296.0" y="353.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.8" fill="#5d6f79" text-anchor="start" font-weight="400" font-style="normal">12 mg</text><text x="58.0" y="371.0" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" fill="#8fa0a9" text-anchor="start" font-weight="400" font-style="normal">Discontinuation for adverse events — placebo 4.9% · 4 mg 4.1% · 9 mg 6.9% · 12 mg 11.3%</text></svg>
