# Alimentos que se comparan. Valores nutricionales por 100 g del producto tal como se vende
# (crudo salvo indicación). Son valores típicos de etiqueta y tablas australianas (AUSNUT/FSANZ):
# si un producto concreto difiere, se corrige aquí.
#
# busquedas: por proveedor, la consulta y los filtros para quedarse con el producto correcto.
#   incluir: todas deben aparecer en el nombre (alternativas separadas por '|')
#   excluir: ninguna puede aparecer
# La clave "_shopify" vale para todas las tiendas de tipo shopify.

items:
  - id: pollo_pechuga
    nombre: Pechuga de pollo
    categoria: proteina
    proteina_100g: 23.0
    kcal_100g: 115
    busquedas:
      woolworths: {q: chicken breast fillets, incluir: [chicken, breast], excluir: [marinated, crumbed, schnitzel, kiev, skewer, tender, thigh, roast, bbq, mini]}
      coles: {q: chicken breast fillets, incluir: [chicken, breast], excluir: [marinated, crumbed, schnitzel, kiev, skewer, tender, thigh, roast, bbq, mini]}
      _shopify: {incluir: [chicken, breast], excluir: [marinated, crumbed, schnitzel, kiev, skewer, thigh]}

