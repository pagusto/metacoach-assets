<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#FFFFFF;
  --canvas:#DFE4E4;
  --ink:#10171D;
  --steel:#2E4756;
  --steel-2:#4B6373;
  --slate:#5A6B77;
  --rule:#C9D2D5;
  --rule-soft:#E3E9EA;
  --tint:#EFF2F2;
  --hivis:#D98A11;
  --ok:#2F6B4F;
  --hold:#9A5B12;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151B20;
    --canvas:#0B0F12;
    --ink:#EAF0F2;
    --steel:#A9C2CE;
    --steel-2:#89A4B1;
    --slate:#9FB0B9;
    --rule:#2C373E;
    --rule-soft:#222C32;
    --tint:#1B2329;
    --hivis:#E9A62E;
    --ok:#6FBF95;
    --hold:#D69B4A;
  }
}
:root[data-theme="dark"]{
  --paper:#151B20;
  --canvas:#0B0F12;
  --ink:#EAF0F2;
  --steel:#A9C2CE;
  --steel-2:#89A4B1;
  --slate:#9FB0B9;
  --rule:#2C373E;
  --rule-soft:#222C32;
  --tint:#1B2329;
  --hivis:#E9A62E;
  --ok:#6FBF95;
  --hold:#D69B4A;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:8.5pt;
  line-height:1.34;
  -webkit-font-smoothing:antialiased;
}
.sheet{
  width:210mm;
  min-height:297mm;
  margin:0 auto 8mm;
  padding:9.5mm 12mm 7mm;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  gap:2.2mm;
}
h1,h2,h3,.eyebrow,.tag,.mono{font-family:"Archivo","Arial Narrow",Helvetica,sans-serif}
.mono,.tag,.eyebrow,.field-label,.ph-id{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- masthead ---------- */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;
  border-bottom:2.5pt solid var(--steel);padding-bottom:2.5mm}
.brand{display:flex;flex-direction:column;gap:1mm}
.brand .mark{display:flex;align-items:center;gap:3mm}
.mark svg{display:block}
.brand .name{font-family:"Archivo";font-weight:700;font-size:14pt;letter-spacing:.02em;line-height:1;color:var(--ink)}
.brand .sub{font-family:"IBM Plex Mono";font-size:7.4pt;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.doc-id{text-align:right;display:flex;flex-direction:column;gap:1.2mm}
.doc-id .kind{font-family:"Archivo";font-weight:600;font-size:11.5pt;letter-spacing:.01em;color:var(--steel)}
.doc-id .no{font-family:"IBM Plex Mono";font-size:7.4pt;letter-spacing:.08em;color:var(--slate);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- title block ---------- */
.title-block h1{
  font-size:13.5pt;font-weight:700;line-height:1.1;margin:0 0 .8mm;
  letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
.title-block .lede{margin:0;color:var(--slate);font-size:8.6pt;max-width:88ch}

/* ---------- project data grid ---------- */
.datagrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1pt solid var(--rule);
  border-left:1pt solid var(--rule)}
.field{border-right:1pt solid var(--rule);border-bottom:1pt solid var(--rule);padding:1.5mm 2.4mm;background:var(--tint)}
.field-label{display:block;font-size:6.4pt;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:.5mm}
.field-value{font-size:8.4pt;font-weight:600;color:var(--ink);line-height:1.25}
.field-value small{display:block;font-weight:400;font-size:7.3pt;color:var(--slate)}

/* ---------- sections ---------- */
section{display:flex;flex-direction:column;gap:2mm}
h2{display:flex;align-items:baseline;gap:2.5mm;margin:0;font-size:9.8pt;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--steel);
  border-bottom:1pt solid var(--rule);padding-bottom:1.3mm}
h2 .num{font-family:"IBM Plex Mono";font-size:8.4pt;font-weight:600;color:var(--hivis);letter-spacing:0}
h3{margin:0;font-size:9.6pt;font-weight:600;letter-spacing:.02em;color:var(--ink)}
p{margin:0}
ul.bullets{margin:0;padding-left:4.5mm;display:flex;flex-direction:column;gap:.8mm}
ul.bullets li{padding-left:.8mm}
ul.bullets li::marker{color:var(--hivis)}
.lead-in{font-weight:600;color:var(--ink)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:8.8pt}
thead th{font-family:"IBM Plex Mono";font-size:6.8pt;letter-spacing:.11em;text-transform:uppercase;
  color:var(--slate);text-align:left;font-weight:500;padding:1.4mm 2.2mm;
  border-bottom:1pt solid var(--rule);white-space:nowrap}
tbody td{padding:0.95mm 2.2mm;border-bottom:.6pt solid var(--rule-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:1pt solid var(--rule)}
td.area{font-weight:600;white-space:nowrap}
td.qty{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--slate)}
.status{font-family:"IBM Plex Mono";font-size:6.4pt;letter-spacing:.05em;text-transform:uppercase;
  white-space:nowrap;padding:.15mm 1.4mm;border:.8pt solid currentColor;border-radius:1pt;display:inline-block}
.status.done{color:var(--ok)}
.status.wip{color:var(--steel-2)}
.status.hold{color:var(--hold)}

/* ---------- callout ---------- */
.callout{border-left:2.5pt solid var(--hivis);background:var(--tint);padding:2.2mm 3mm;
  display:flex;flex-direction:column;gap:1.5mm}
.callout .k{font-family:"IBM Plex Mono";font-size:7pt;letter-spacing:.12em;text-transform:uppercase;color:var(--hivis)}

/* ---------- signatures ---------- */
.sign{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10mm;padding-top:1mm}
.sign .slot{border-top:1pt solid var(--rule);padding-top:2mm}
.sign .who{font-weight:600;font-size:9pt}
.sign .role{font-size:8pt;color:var(--slate)}
.sign .line{margin-top:1.6mm;border-top:.8pt dotted var(--rule);padding-top:1.4mm;
  font-family:"IBM Plex Mono";font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}

/* ---------- footer ---------- */
.foot{display:flex;justify-content:space-between;font-family:"IBM Plex Mono";font-size:7pt;
  letter-spacing:.09em;text-transform:uppercase;color:var(--slate);
  border-top:1pt solid var(--rule);padding-top:2mm}

/* ---------- photo record ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4.5mm;flex:1;align-content:space-between}
figure{margin:0;display:flex;flex-direction:column;break-inside:avoid}
.frame{position:relative;width:100%;aspect-ratio:10/9;background:var(--tint);overflow:hidden;
  border:.8pt solid var(--rule)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame.doc img{object-fit:contain;background:var(--tint)}
.ph-id{position:absolute;left:0;top:0;background:var(--steel);color:var(--paper);
  font-size:6.4pt;font-weight:600;letter-spacing:.06em;padding:.7mm 1.7mm}
figcaption{padding-top:1.4mm;display:flex;flex-direction:column;gap:.6mm}
figcaption .cap-t{font-family:"Archivo";font-weight:600;font-size:8pt;line-height:1.2;color:var(--ink)}
figcaption .cap-d{font-size:7.2pt;line-height:1.3;color:var(--slate)}
.tag{font-family:"IBM Plex Mono";font-size:6.1pt;letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel-2);border:.7pt solid var(--rule);padding:.4mm 1.6mm;align-self:flex-start;border-radius:1pt}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm;align-items:start}
.cols > section{gap:1.8mm}
ul.bullets.two{display:block;columns:2;column-gap:6mm;padding-left:4.2mm}
ul.bullets.two li{break-inside:avoid;margin-bottom:1.2mm}
.dist{display:flex;flex-direction:column;gap:1.6mm;margin-top:.5mm}
.dist .row{display:flex;flex-direction:column;gap:.3mm;padding-bottom:1.4mm;border-bottom:.6pt solid var(--rule-soft)}
.dist .row:last-child{border-bottom:none}
.dist .who{font-weight:600;font-size:8.8pt}
.dist .meta{font-size:8pt;color:var(--slate)}
.note{font-size:8.2pt;color:var(--slate)}
.note b{color:var(--ink);font-weight:600}

@media print{
  body{background:#fff}
  .sheet{margin:0;box-shadow:none;page-break-after:always;min-height:294mm;overflow:hidden}
  .sheet:last-child{page-break-after:auto}
}
@page{size:A4;margin:0}

@media screen and (max-width:230mm){
  .sheet{width:100%;min-height:0;padding:8mm 6mm}
  .datagrid{grid-template-columns:1fr 1fr}
  .photo-grid{grid-template-columns:1fr 1fr}
  .cols{grid-template-columns:1fr}
}
</style>
